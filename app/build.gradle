plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akh.sandhyasankalpa'
    compileSdk 35

    defaultConfig {
        applicationId 'com.akh.sandhyasankalpa'
        minSdk 26
        targetSdk 35
        // Each GitHub build gets a higher version number, so it installs as an update
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionCode run
        versionName "1.${run}"
    }

    // One fixed key for every build, so a new APK always installs over the previous one
    signingConfigs {
        release {
            storeFile file('sandhyasankalpa.jks')
            storePassword 'Sandhya2026Key'
            keyAlias 'sandhyasankalpa'
            keyPassword 'Sandhya2026Key'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app uses only the Android platform APIs.
