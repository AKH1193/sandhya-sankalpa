plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akh.sandhyasankalpa'
    compileSdk 35

    defaultConfig {
        applicationId 'com.akh.sandhyasankalpa'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so a release APK can be sideloaded without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: the app uses only the Android platform APIs.
